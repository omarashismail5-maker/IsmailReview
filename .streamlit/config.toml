[theme]
base = "dark"

# Dark graphite color palette
primaryColor = "#AAB4BF"
backgroundColor = "#14171B"
secondaryBackgroundColor = "#22262C"
textColor = "#F0F1F3"

# Google Sans typography
font = "'Google Sans Flex':https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap"
headingFont = "'Google Sans Flex':https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap"

baseFontSize = 16
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#1B1E23"
secondaryBackgroundColor = "#292D34"
textColor = "#D9DDE2"